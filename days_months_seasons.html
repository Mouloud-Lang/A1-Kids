<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kids Learning Flashcards</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
      --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
      --card-hover: 0 15px 25px rgba(0, 0, 0, 0.2);
      --primary: #ff6b6b;
      --secondary: #4ecdc4;
      --accent: #ffe66d;
      --text-dark: #2d3436;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-dark);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 2.8rem;
      color: #ffffff;
      text-shadow: 3px 3px 0px #ff6b6b, 6px 6px 0px rgba(0,0,0,0.1);
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 1.25rem;
      color: #2d3436;
      background: rgba(255, 255, 255, 0.75);
      padding: 8px 20px;
      border-radius: 30px;
      display: inline-block;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .tab-btn {
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 600;
      padding: 13px 22px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: #ffffff;
      color: var(--text-dark);
      box-shadow: 0 6px 0 #d1d8e0;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    .tab-btn:hover {
      transform: translateY(-2px);
    }

    .tab-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d1d8e0;
    }

    .tab-btn.active {
      background: #ff9f43;
      color: #ffffff;
      box-shadow: 0 6px 0 #ee5253;
    }

    .tab-btn.practice-tab {
      background: #e0f7fa;
      color: #00695c;
      box-shadow: 0 6px 0 #80cbc4;
    }

    .tab-btn.practice-tab.active {
      background: #4ecdc4;
      color: #ffffff;
      box-shadow: 0 6px 0 #26a69a;
    }

    .controls {
      margin-bottom: 25px;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 22px;
      border-radius: 25px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls select {
      font-family: inherit;
      font-size: 1rem;
      padding: 5px 12px;
      border-radius: 15px;
      border: 2px solid #4ecdc4;
      background: white;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 1050px;
    }

    .card {
      background: #ffffff;
      border-radius: 28px;
      padding: 28px 18px;
      text-align: center;
      cursor: pointer;
      box-shadow: var(--card-shadow);
      border: 5px solid #ffffff;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .card:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: var(--card-hover);
    }

    .card:active, .card.speaking {
      transform: scale(0.96);
      border-color: #ffe66d;
      animation: bounce 0.6s ease;
    }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      30% { transform: scale(1.08) rotate(-2deg); }
      60% { transform: scale(1.05) rotate(2deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .card-emoji {
      font-size: 4.5rem;
      margin-bottom: 14px;
      display: block;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
    }

    .card-word {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .card-sub {
      font-size: 1rem;
      color: #636e72;
      font-weight: 500;
    }

    .speaker-badge {
      position: absolute;
      top: 12px;
      right: 14px;
      font-size: 1.3rem;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card.speaking .speaker-badge {
      background: #ffe66d;
      transform: scale(1.2);
    }

    /* Practice Modes Styling */
    .practice-container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border-radius: 32px;
      padding: 32px 24px;
      text-align: center;
      box-shadow: var(--card-shadow);
      border: 6px solid #ffffff;
      display: none;
    }

    .practice-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .practice-topic-select {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      border: 2px solid #ff9f43;
      background: #fff8f0;
      color: var(--text-dark);
      cursor: pointer;
    }

    .score-pill {
      background: #ffe66d;
      color: #2d3436;
      font-weight: 700;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 1.05rem;
    }

    .practice-emoji {
      font-size: 5rem;
      margin: 10px 0;
      display: block;
    }

    .listen-btn {
      font-family: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      padding: 12px 26px;
      border: none;
      border-radius: 50px;
      background: #4ecdc4;
      color: white;
      cursor: pointer;
      box-shadow: 0 5px 0 #26a69a;
      margin-bottom: 18px;
      transition: transform 0.1s;
    }

    .listen-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #26a69a;
    }

    .hint-clue {
      font-size: 1.15rem;
      color: #636e72;
      margin-bottom: 18px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .spelling-form {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .spelling-input {
      font-family: inherit;
      font-size: 1.6rem;
      font-weight: 700;
      padding: 12px 20px;
      border-radius: 20px;
      border: 3px solid #a1c4fd;
      text-align: center;
      width: 260px;
      outline: none;
      color: var(--text-dark);
    }

    .spelling-input:focus {
      border-color: #4ecdc4;
    }

    .spelling-input.wrong {
      border-color: #ff6b6b;
      animation: shake 0.4s;
    }

    .spelling-input.correct {
      border-color: #2ecc71;
      background: #eafaf1;
    }

    .action-btn {
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      padding: 12px 24px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      color: white;
      transition: transform 0.1s;
    }

    .btn-check {
      background: #ff6b6b;
      box-shadow: 0 5px 0 #ee5253;
    }

    .btn-check:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #ee5253;
    }

    .btn-secondary {
      background: #a29bfe;
      box-shadow: 0 5px 0 #6c5ce7;
      font-size: 1rem;
      padding: 10px 18px;
    }

    .btn-secondary:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #6c5ce7;
    }

    .btn-next {
      background: #2ecc71;
      box-shadow: 0 5px 0 #27ae60;
      display: none;
      margin: 12px auto 0;
    }

    .practice-actions-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .feedback-msg {
      font-size: 1.3rem;
      font-weight: 700;
      min-height: 34px;
      margin-top: 12px;
    }

    /* Unscramble Tiles Styling */
    .answer-slots, .letter-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin: 16px 0;
      min-height: 62px;
    }

    .answer-slots {
      background: #f1f2f6;
      padding: 12px;
      border-radius: 20px;
      border: 3px dashed #ced6e0;
    }

    .answer-slots.correct {
      background: #eafaf1;
      border-color: #2ecc71;
    }

    .answer-slots.wrong {
      border-color: #ff6b6b;
      animation: shake 0.4s;
    }

    .slot-box {
      width: 48px;
      height: 54px;
      border-radius: 14px;
      background: #ffffff;
      border: 2px solid #dfe4ea;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text-dark);
      cursor: pointer;
      user-select: none;
    }

    .slot-box.filled {
      background: #4ecdc4;
      color: white;
      border-color: #26a69a;
      box-shadow: 0 4px 0 #26a69a;
    }

    .letter-tile {
      width: 50px;
      height: 56px;
      border-radius: 16px;
      background: #ffe66d;
      color: #2d3436;
      border: none;
      font-family: inherit;
      font-size: 1.7rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 0 #feca57;
      transition: transform 0.1s, opacity 0.2s;
    }

    .letter-tile:hover:not(:disabled) {
      transform: translateY(-3px);
    }

    .letter-tile:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #feca57;
    }

    .letter-tile:disabled {
      opacity: 0.25;
      cursor: default;
      box-shadow: none;
    }

    footer {
      margin-top: auto;
      padding-top: 35px;
      font-size: 0.95rem;
      color: #2d3436;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌈 Magic Flashcards 🎈</h1>
    <p class="subtitle" id="subtitleText">Tap any card to hear the word!</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="selectCategory('days', this)">📅 Days of the Week</button>
    <button class="tab-btn" onclick="selectCategory('seasons', this)">🌻 Seasons</button>
    <button class="tab-btn" onclick="selectCategory('months', this)">🎂 Months of the Year</button>
    <button class="tab-btn practice-tab" onclick="openPracticeMode('spelling', this)">✏️ Practice Spelling</button>
    <button class="tab-btn practice-tab" onclick="openPracticeMode('unscramble', this)">🔀 Unscramble Letters</button>
  </div>

  <div class="controls">
    <label for="speedSelect">🐢 Voice Speed:</label>
    <select id="speedSelect">
      <option value="0.55" selected>Extra Slow (Super Clear)</option>
      <option value="0.7">Slow (Best for Kids)</option>
      <option value="0.9">Normal</option>
    </select>
  </div>

  <main class="grid" id="cardGrid"></main>

  <!-- Practice Spelling Container -->
  <section class="practice-container" id="spellingContainer">
    <div class="practice-header">
      <select class="practice-topic-select" id="spellingTopic" onchange="resetPracticeList('spelling')">
        <option value="all" selected>🌟 All Words</option>
        <option value="days">📅 Days of the Week</option>
        <option value="seasons">🌻 Seasons</option>
        <option value="months">🎂 Months of the Year</option>
      </select>
      <span class="score-pill" id="spellingProgress">Word 1 / 23</span>
      <span class="score-pill" id="spellingScore">⭐ Stars: 0</span>
    </div>

    <span class="practice-emoji" id="spellingEmoji">🎒</span>
    <button class="listen-btn" onclick="speakCurrentPracticeWord()">🔊 Listen to Word</button>
    <div class="hint-clue" id="spellingHint">_ _ _ _ _ _ (6 letters)</div>

    <div class="spelling-form">
      <input type="text" id="spellingInput" class="spelling-input" placeholder="Type word here..." autocomplete="off" spellcheck="false" />
      <button class="action-btn btn-check" onclick="checkSpelling()">Check ✔️</button>
    </div>

    <div class="practice-actions-row">
      <button class="action-btn btn-secondary" onclick="revealSpellingHint()">💡 Letter Hint</button>
      <button class="action-btn btn-secondary" onclick="nextPracticeWord('spelling')">Skip ⏭️</button>
    </div>

    <div class="feedback-msg" id="spellingFeedback"></div>
    <button class="action-btn btn-next" id="spellingNextBtn" onclick="nextPracticeWord('spelling')">Next Word ➡️</button>
  </section>

  <!-- Unscramble Letters Container -->
  <section class="practice-container" id="unscrambleContainer">
    <div class="practice-header">
      <select class="practice-topic-select" id="unscrambleTopic" onchange="resetPracticeList('unscramble')">
        <option value="all" selected>🌟 All Words</option>
        <option value="days">📅 Days of the Week</option>
        <option value="seasons">🌻 Seasons</option>
        <option value="months">🎂 Months of the Year</option>
      </select>
      <span class="score-pill" id="unscrambleProgress">Word 1 / 23</span>
      <span class="score-pill" id="unscrambleScore">⭐ Stars: 0</span>
    </div>

    <span class="practice-emoji" id="unscrambleEmoji">🎒</span>
    <button class="listen-btn" onclick="speakCurrentPracticeWord()">🔊 Listen to Word</button>
    <div class="hint-clue" id="unscrambleSub">Tap the letters in the right order!</div>

    <div class="answer-slots" id="answerSlots"></div>
    <div class="letter-bank" id="letterBank"></div>

    <div class="practice-actions-row">
      <button class="action-btn btn-secondary" onclick="clearUnscramble()">🔄 Reset Letters</button>
      <button class="action-btn btn-check" onclick="checkUnscramble()">Check ✔️</button>
      <button class="action-btn btn-secondary" onclick="nextPracticeWord('unscramble')">Skip ⏭️</button>
    </div>

    <div class="feedback-msg" id="unscrambleFeedback"></div>
    <button class="action-btn btn-next" id="unscrambleNextBtn" onclick="nextPracticeWord('unscramble')">Next Word ➡️</button>
  </section>

  <footer>
    Click a card to listen and repeat out loud! 🗣️✨
  </footer>

  <script>
    const flashcardsData = {
      days: [
        { word: "Monday", emoji: "🎒", sub: "Day 1", bg: "#FFF3E0" },
        { word: "Tuesday", emoji: "🖍️", sub: "Day 2", bg: "#E8F5E9" },
        { word: "Wednesday", emoji: "🧩", sub: "Day 3", bg: "#E3F2FD" },
        { word: "Thursday", emoji: "🚀", sub: "Day 4", bg: "#F3E5F5" },
        { word: "Friday", emoji: "🎉", sub: "Day 5", bg: "#FFFDE7" },
        { word: "Saturday", emoji: "🛝", sub: "Day 6", bg: "#FCE4EC" },
        { word: "Sunday", emoji: "☀️", sub: "Day 7", bg: "#E0F7FA" }
      ],
      seasons: [
        { word: "Spring", emoji: "🌸", sub: "Flowers bloom", bg: "#FCE4EC" },
        { word: "Summer", emoji: "🏖️", sub: "Sunny & warm", bg: "#FFFDE7" },
        { word: "Autumn", emoji: "🍂", sub: "Leaves fall", bg: "#FFF3E0" },
        { word: "Winter", emoji: "⛄", sub: "Cold & snowy", bg: "#E3F2FD" }
      ],
      months: [
        { word: "January", emoji: "❄️", sub: "Month 1", bg: "#E3F2FD" },
        { word: "February", emoji: "💖", sub: "Month 2", bg: "#FCE4EC" },
        { word: "March", emoji: "🍀", sub: "Month 3", bg: "#E8F5E9" },
        { word: "April", emoji: "🌧️", sub: "Month 4", bg: "#E0F7FA" },
        { word: "May", emoji: "🌷", sub: "Month 5", bg: "#F3E5F5" },
        { word: "June", emoji: "🦋", sub: "Month 6", bg: "#FFFDE7" },
        { word: "July", emoji: "🍉", sub: "Month 7", bg: "#FFEBEE" },
        { word: "August", emoji: "🍦", sub: "Month 8", bg: "#FFF3E0" },
        { word: "September", emoji: "🍎", sub: "Month 9", bg: "#E8F5E9" },
        { word: "October", emoji: "🎃", sub: "Month 10", bg: "#FFF3E0" },
        { word: "November", emoji: "🦃", sub: "Month 11", bg: "#EFEBE9" },
        { word: "December", emoji: "🎄", sub: "Month 12", bg: "#E0F2F1" }
      ]
    };

    const cardGrid = document.getElementById('cardGrid');
    const speedSelect = document.getElementById('speedSelect');
    const subtitleText = document.getElementById('subtitleText');
    const spellingContainer = document.getElementById('spellingContainer');
    const unscrambleContainer = document.getElementById('unscrambleContainer');

    let currentMode = 'cards';
    let practiceWords = [];
    let practiceIndex = 0;
    let starsCount = 0;
    let hintLettersRevealed = 0;

    // Unscramble state
    let scrambledTiles = [];
    let selectedTileIndices = [];

    function getAllWords() {
      return [
        ...flashcardsData.days,
        ...flashcardsData.seasons,
        ...flashcardsData.months
      ];
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function renderCards(category) {
      cardGrid.innerHTML = '';
      const items = flashcardsData[category];

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.style.backgroundColor = item.bg;

        card.innerHTML = `
          <div class="speaker-badge">🔊</div>
          <span class="card-emoji">${item.emoji}</span>
          <div class="card-word">${item.word}</div>
          <div class="card-sub">${item.sub}</div>
        `;

        card.addEventListener('click', () => speakWord(item.word, card));
        cardGrid.appendChild(card);
      });
    }

    function selectCategory(category, btnElement) {
      currentMode = 'cards';
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      window.speechSynthesis.cancel();

      subtitleText.textContent = "Tap any card to hear the word!";
      cardGrid.style.display = 'grid';
      spellingContainer.style.display = 'none';
      unscrambleContainer.style.display = 'none';

      renderCards(category);
    }

    function speakText(text, cardElement = null) {
      window.speechSynthesis.cancel();
      document.querySelectorAll('.card').forEach(c => c.classList.remove('speaking'));

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = parseFloat(speedSelect.value);
      utterance.pitch = 1.15;

      if (cardElement) {
        cardElement.classList.add('speaking');
        utterance.onend = () => cardElement.classList.remove('speaking');
        utterance.onerror = () => cardElement.classList.remove('speaking');
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakWord(word, cardElement) {
      speakText(word, cardElement);
    }

    // Practice Modes Logic
    function openPracticeMode(mode, btnElement) {
      currentMode = mode;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      btnElement.classList.add('active');
      window.speechSynthesis.cancel();

      cardGrid.style.display = 'none';
      spellingContainer.style.display = mode === 'spelling' ? 'block' : 'none';
      unscrambleContainer.style.display = mode === 'unscramble' ? 'block' : 'none';

      const topicSelect = document.getElementById(mode + 'Topic');
      topicSelect.value = 'all';

      subtitleText.textContent = mode === 'spelling'
        ? "Listen carefully and spell the word!"
        : "Put the mixed-up letters in the right order!";

      resetPracticeList(mode);
    }

    function resetPracticeList(mode) {
      const topic = document.getElementById(mode + 'Topic').value;
      const rawList = topic === 'all' ? getAllWords() : flashcardsData[topic];
      practiceWords = shuffleArray(rawList);
      practiceIndex = 0;
      starsCount = 0;

      if (mode === 'spelling') {
        loadSpellingQuestion();
      } else {
        loadUnscrambleQuestion();
      }
    }

    function speakCurrentPracticeWord() {
      if (practiceWords[practiceIndex]) {
        speakText(practiceWords[practiceIndex].word);
      }
    }

    // --- SPELLING MODE ---
    function loadSpellingQuestion() {
      const current = practiceWords[practiceIndex];
      hintLettersRevealed = 0;

      document.getElementById('spellingProgress').textContent = `Word ${practiceIndex + 1} / ${practiceWords.length}`;
      document.getElementById('spellingScore').textContent = `⭐ Stars: ${starsCount}`;
      document.getElementById('spellingEmoji').textContent = current.emoji;
      updateSpellingHintDisplay();

      const input = document.getElementById('spellingInput');
      input.value = '';
      input.className = 'spelling-input';
      input.disabled = false;
      input.focus();

      document.getElementById('spellingFeedback').textContent = '';
      document.getElementById('spellingNextBtn').style.display = 'none';

      speakText(current.word);
    }

    function updateSpellingHintDisplay() {
      const word = practiceWords[practiceIndex].word;
      let display = '';
      for (let i = 0; i < word.length; i++) {
        display += (i < hintLettersRevealed ? word[i] : '_') + ' ';
      }
      document.getElementById('spellingHint').textContent = `${display.trim()} (${word.length} letters)`;
    }

    function revealSpellingHint() {
      const word = practiceWords[practiceIndex].word;
      if (hintLettersRevealed < word.length) {
        hintLettersRevealed++;
        updateSpellingHintDisplay();
        document.getElementById('spellingInput').focus();
      }
    }

    function checkSpelling() {
      const current = practiceWords[practiceIndex];
      const input = document.getElementById('spellingInput');
      const feedback = document.getElementById('spellingFeedback');
      const guess = input.value.trim();

      if (!guess) return;

      if (guess.toLowerCase() === current.word.toLowerCase()) {
        input.className = 'spelling-input correct';
        input.value = current.word;
        input.disabled = true;
        starsCount++;
        document.getElementById('spellingScore').textContent = `⭐ Stars: ${starsCount}`;
        feedback.style.color = '#27ae60';
        feedback.textContent = `🎉 Awesome! "${current.word}" is correct!`;
        document.getElementById('spellingNextBtn').style.display = 'inline-block';
        speakText(`Great job! ${current.word}`);
      } else {
        input.classList.remove('wrong');
        void input.offsetWidth; // trigger reflow for animation
        input.classList.add('wrong');
        feedback.style.color = '#ee5253';
        feedback.textContent = "Almost! Listen again and try one more time 💪";
        speakText("Try again");
      }
    }

    document.getElementById('spellingInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        if (document.getElementById('spellingNextBtn').style.display === 'inline-block') {
          nextPracticeWord('spelling');
        } else {
          checkSpelling();
        }
      }
    });

    // --- UNSCRAMBLE MODE ---
    function loadUnscrambleQuestion() {
      const current = practiceWords[practiceIndex];
      document.getElementById('unscrambleProgress').textContent = `Word ${practiceIndex + 1} / ${practiceWords.length}`;
      document.getElementById('unscrambleScore').textContent = `⭐ Stars: ${starsCount}`;
      document.getElementById('unscrambleEmoji').textContent = current.emoji;
      document.getElementById('unscrambleSub').textContent = `Hint: ${current.sub} (${current.word.length} letters)`;
      document.getElementById('unscrambleFeedback').textContent = '';
      document.getElementById('unscrambleNextBtn').style.display = 'none';

      const letters = current.word.split('');
      let shuffled = shuffleArray(letters);
      // Ensure letters are actually scrambled if word has > 1 unique letter
      if (shuffled.join('') === current.word && new Set(letters).size > 1) {
        shuffled.reverse();
      }

      scrambledTiles = shuffled;
      selectedTileIndices = [];
      renderUnscrambleBoard();
      speakText(current.word);
    }

    function renderUnscrambleBoard() {
      const slotsDiv = document.getElementById('answerSlots');
      const bankDiv = document.getElementById('letterBank');
      const wordLen = practiceWords[practiceIndex].word.length;

      slotsDiv.className = 'answer-slots';
      slotsDiv.innerHTML = '';
      for (let i = 0; i < wordLen; i++) {
        const slot = document.createElement('div');
        if (i < selectedTileIndices.length) {
          const tileIdx = selectedTileIndices[i];
          slot.className = 'slot-box filled';
          slot.textContent = scrambledTiles[tileIdx];
          slot.title = 'Click to remove letter';
          slot.onclick = () => {
            if (document.getElementById('unscrambleNextBtn').style.display === 'inline-block') return;
            selectedTileIndices.splice(i, 1);
            renderUnscrambleBoard();
          };
        } else {
          slot.className = 'slot-box';
          slot.textContent = '';
        }
        slotsDiv.appendChild(slot);
      }

      bankDiv.innerHTML = '';
      scrambledTiles.forEach((char, idx) => {
        const btn = document.createElement('button');
        btn.className = 'letter-tile';
        btn.textContent = char;
        btn.disabled = selectedTileIndices.includes(idx);
        btn.onclick = () => {
          if (document.getElementById('unscrambleNextBtn').style.display === 'inline-block') return;
          selectedTileIndices.push(idx);
          renderUnscrambleBoard();
        };
        bankDiv.appendChild(btn);
      });
    }

    function clearUnscramble() {
      if (document.getElementById('unscrambleNextBtn').style.display === 'inline-block') return;
      selectedTileIndices = [];
      document.getElementById('unscrambleFeedback').textContent = '';
      renderUnscrambleBoard();
    }

    function checkUnscramble() {
      const current = practiceWords[practiceIndex];
      const feedback = document.getElementById('unscrambleFeedback');
      const slotsDiv = document.getElementById('answerSlots');
      const builtWord = selectedTileIndices.map(idx => scrambledTiles[idx]).join('');

      if (builtWord.length < current.word.length) {
        feedback.style.color = '#ff9f43';
        feedback.textContent = "Place all the letters into the boxes first! 🧩";
        return;
      }

      if (builtWord.toLowerCase() === current.word.toLowerCase()) {
        slotsDiv.classList.add('correct');
        starsCount++;
        document.getElementById('unscrambleScore').textContent = `⭐ Stars: ${starsCount}`;
        feedback.style.color = '#27ae60';
        feedback.textContent = `🎉 Fantastic! You unscrambled "${current.word}"!`;
        document.getElementById('unscrambleNextBtn').style.display = 'inline-block';
        speakText(`Awesome! ${current.word}`);
      } else {
        slotsDiv.classList.remove('wrong');
        void slotsDiv.offsetWidth;
        slotsDiv.classList.add('wrong');
        feedback.style.color = '#ee5253';
        feedback.textContent = "Not quite! Tap a placed letter or Reset to try again 💪";
        speakText("Try again");
      }
    }

    function nextPracticeWord(mode) {
      practiceIndex++;
      if (practiceIndex >= practiceWords.length) {
        practiceWords = shuffleArray(practiceWords);
        practiceIndex = 0;
      }
      if (mode === 'spelling') {
        loadSpellingQuestion();
      } else {
        loadUnscrambleQuestion();
      }
    }

    // Initial render
    renderCards('days');
  </script>
</body>
</html>
