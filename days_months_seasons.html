<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Days, Seasons & Months — Flashcards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f6d5f7 0%, #fbe9d7 48%, #d4e4ff 100%);
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-strong: rgba(255, 255, 255, 0.94);
      --glass-border: rgba(255, 255, 255, 0.88);
      --text-main: #1e1b4b;
      --text-muted: #64748b;
      --primary: #7c3aed;
      --primary-pink: #ec4899;
      --accent-gradient: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
      --success: #10b981;
      --danger: #ef4444;
      --shadow-card: 0 22px 45px -15px rgba(124, 58, 237, 0.22), 0 8px 20px -8px rgba(15, 23, 42, 0.08);
      --shadow-soft: 0 10px 25px -5px rgba(124, 58, 237, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100dvh;
      overflow-x: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(12px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
      position: relative;
    }

    /* Ambient Pastel Orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.65;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }
    .orb-1 { width: 260px; height: 260px; background: #e879f9; top: -60px; left: -60px; }
    .orb-2 { width: 280px; height: 280px; background: #93c5fd; bottom: -70px; right: -60px; animation-delay: -5s; }
    .orb-3 { width: 200px; height: 200px; background: #fbcfe8; top: 42%; left: 55%; animation-delay: -9s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(18px, -22px) scale(1.08); }
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }

    /* Header */
    header {
      text-align: center;
      flex-shrink: 0;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.48rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
      margin-top: 2px;
    }

    /* High-Visibility Mode Dock */
    .mode-dock {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--glass-border);
      padding: 6px;
      border-radius: 20px;
      box-shadow: var(--shadow-soft);
      flex-shrink: 0;
    }

    .mode-btn {
      height: 46px;
      border: none;
      border-radius: 15px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: transparent;
      color: var(--text-main);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .mode-btn.active {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 8px 20px -4px rgba(124, 58, 237, 0.45);
      transform: translateY(-1px);
    }

    /* Category Pills */
    .category-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 2px 0;
      flex-shrink: 0;
    }
    .category-bar::-webkit-scrollbar { display: none; }

    .cat-pill {
      flex: 1;
      white-space: nowrap;
      padding: 8px 10px;
      border-radius: 14px;
      border: 1.5px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .cat-pill.active {
      background: var(--glass-strong);
      color: var(--primary);
      border-color: rgba(124, 58, 237, 0.35);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.14);
    }

    /* Progress Bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .progress-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent-gradient);
      border-radius: 999px;
      transition: width 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .progress-label {
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--glass-strong);
      padding: 3px 10px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
    }

    /* Flashcard Stage */
    .stage {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      perspective: 1200px;
    }

    .card-scene {
      width: 100%;
      height: 100%;
      max-height: 390px;
      cursor: pointer;
      user-select: none;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.62s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }

    .card-scene.is-flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background: var(--glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid #ffffff;
      border-radius: 30px;
      box-shadow: var(--shadow-card);
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .card-back {
      transform: rotateY(180deg);
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.96) 0%, rgba(245, 243, 255, 0.96) 100%);
    }

    .card-top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.1);
      color: var(--primary);
      letter-spacing: 0.02em;
    }

    .badge-sub {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(236, 72, 153, 0.1);
      color: var(--primary-pink);
    }

    .emoji-frame {
      width: 112px;
      height: 112px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4.2rem;
      box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.12), inset 0 2px 4px rgba(255, 255, 255, 0.9);
      border: 2px solid #ffffff;
      transition: transform 0.3s ease;
    }

    .card-scene:hover .emoji-frame {
      transform: scale(1.05) rotate(-2deg);
    }

    .front-word {
      font-family: 'Outfit', sans-serif;
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .tap-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Back Side Elements */
    .listen-btn {
      border: none;
      background: var(--accent-gradient);
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 6px 14px -3px rgba(124, 58, 237, 0.4);
      transition: transform 0.15s ease;
    }

    .listen-btn:active {
      transform: scale(0.94);
    }

    .back-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
    }

    .back-mini-emoji {
      font-size: 2.6rem;
      line-height: 1;
    }

    .back-eng-word {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .russian-box {
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.1) 0%, rgba(236, 72, 153, 0.1) 100%);
      border: 1.5px solid rgba(124, 58, 237, 0.22);
      padding: 14px 24px;
      border-radius: 20px;
      width: 90%;
    }

    .russian-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      margin-bottom: 4px;
    }

    .russian-word {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Controls Bar */
    .controls-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 10px;
      flex-shrink: 0;
    }

    .nav-btn {
      height: 50px;
      border-radius: 18px;
      border: 1.5px solid var(--glass-border);
      background: var(--glass-strong);
      font-family: 'Outfit', sans-serif;
      font-size: 0.96rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      box-shadow: var(--shadow-soft);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .nav-btn:active {
      transform: scale(0.96);
    }

    .nav-btn.primary-next {
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
    }

    .nav-btn.shuffle-btn {
      width: 54px;
      font-size: 1.15rem;
    }

    /* ================= TEST MODE ================= */
    .test-panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      justify-content: space-between;
      background: var(--glass-strong);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 2px solid #ffffff;
      border-radius: 30px;
      box-shadow: var(--shadow-card);
      padding: 16px 18px;
      overflow-y: auto;
    }

    .test-panel.active {
      display: flex;
    }

    .exercise-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: rgba(124, 58, 237, 0.08);
      padding: 5px;
      border-radius: 16px;
      margin-bottom: 10px;
    }

    .ex-tab {
      border: none;
      border-radius: 12px;
      padding: 9px 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ex-tab.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.14);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .stat-chip {
      font-family: 'Outfit', sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(124, 58, 237, 0.09);
      color: var(--primary);
    }

    .stat-chip.streak {
      background: rgba(236, 72, 153, 0.12);
      color: var(--primary-pink);
    }

    .test-prompt-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      margin: 4px 0;
    }

    .test-emoji-frame {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.9rem;
      border: 2px solid #ffffff;
      box-shadow: 0 8px 18px -6px rgba(15, 23, 42, 0.12);
    }

    .hint-text {
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .spelling-input {
      width: 100%;
      height: 48px;
      border-radius: 16px;
      border: 2px solid rgba(124, 58, 237, 0.25);
      background: #ffffff;
      padding: 0 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .spelling-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
    }

    .spelling-input.correct {
      border-color: var(--success);
      background: #ecfdf5;
      color: #065f46;
    }

    .spelling-input.wrong {
      border-color: var(--danger);
      background: #fef2f2;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    /* Unscramble Slots & Bank */
    .answer-slots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      min-height: 46px;
      width: 100%;
      padding: 8px;
      border-radius: 16px;
      background: rgba(124, 58, 237, 0.06);
      border: 1.5px dashed rgba(124, 58, 237, 0.28);
    }

    .answer-slots.correct {
      background: #ecfdf5;
      border-color: var(--success);
      border-style: solid;
    }

    .answer-slots.wrong {
      border-color: var(--danger);
      animation: shake 0.35s ease;
    }

    .slot-box {
      width: 34px;
      height: 38px;
      border-radius: 10px;
      background: #ffffff;
      border: 1.5px solid rgba(124, 58, 237, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
    }

    .slot-box.filled {
      background: var(--accent-gradient);
      color: #ffffff;
      border: none;
    }

    .letter-bank {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      width: 100%;
      margin-top: 4px;
    }

    .letter-tile {
      width: 38px;
      height: 42px;
      border-radius: 12px;
      border: 1.5px solid rgba(124, 58, 237, 0.22);
      background: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--primary);
      box-shadow: 0 4px 10px rgba(124, 58, 237, 0.1);
      cursor: pointer;
      transition: transform 0.12s, opacity 0.2s;
    }

    .letter-tile:active:not(:disabled) {
      transform: scale(0.92);
    }

    .letter-tile:disabled {
      opacity: 0.25;
      cursor: default;
    }

    .test-btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
      margin-top: 6px;
    }

    .t-btn {
      flex: 1;
      height: 44px;
      border-radius: 14px;
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s;
    }

    .t-btn:active { transform: scale(0.96); }

    .t-btn.secondary {
      background: rgba(124, 58, 237, 0.1);
      color: var(--primary);
    }

    .t-btn.check {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 6px 16px -4px rgba(124, 58, 237, 0.4);
    }

    .t-btn.next {
      background: var(--success);
      color: #ffffff;
      display: none;
    }

    .feedback-line {
      min-height: 22px;
      font-size: 0.86rem;
      font-weight: 700;
      text-align: center;
      margin-top: 4px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="app-shell">
    <header>
      <div class="title-row">
        <h1>Days, Seasons & Months</h1>
      </div>
      <p class="subtitle" id="subtitleText">Tap card to flip & hear pronunciation</p>
    </header>

    <!-- Prominent Mode Switcher -->
    <div class="mode-dock">
      <button class="mode-btn active" id="btnModeCards" onclick="switchAppMode('cards')">
        <span>🃏</span> Flashcards
      </button>
      <button class="mode-btn" id="btnModeTest" onclick="switchAppMode('test')">
        <span>✍️</span> Test Mode
      </button>
    </div>

    <!-- Category Filters -->
    <div class="category-bar">
      <button class="cat-pill active" onclick="setCategory('all', this)">All (23)</button>
      <button class="cat-pill" onclick="setCategory('days', this)">📅 Days (7)</button>
      <button class="cat-pill" onclick="setCategory('seasons', this)">🌻 Seasons (4)</button>
      <button class="cat-pill" onclick="setCategory('months', this)">🎂 Months (12)</button>
    </div>

    <!-- Progress -->
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel">1 / 23</div>
    </div>

    <!-- FLASHCARDS VIEW -->
    <main class="stage" id="flashcardStage">
      <div class="card-scene" id="cardScene" onclick="flipCard()">
        <div class="card-inner">
          <!-- Front -->
          <div class="card-face card-front">
            <div class="card-top-bar">
              <span class="badge-pill" id="frontCatBadge">Days</span>
              <span class="badge-sub" id="frontSubBadge">Day 1</span>
            </div>

            <div class="emoji-frame" id="frontEmojiFrame" style="background: #FFF3E0;">
              <span id="frontEmoji">🎒</span>
            </div>

            <div class="front-word" id="frontWord">Monday</div>

            <div class="tap-hint">👆 Tap to flip & listen</div>
          </div>

          <!-- Back -->
          <div class="card-face card-back">
            <div class="card-top-bar">
              <span class="badge-sub" id="backSubBadge">Day 1</span>
              <button class="listen-btn" onclick="event.stopPropagation(); speakCurrentCard();">
                🔊 Listen
              </button>
            </div>

            <div class="back-center">
              <div class="back-mini-emoji" id="backEmoji">🎒</div>
              <div class="back-eng-word" id="backWord">Monday</div>
              <div class="russian-box">
                <div class="russian-label">Russian Translation</div>
                <div class="russian-word" id="backRussian">понедельник</div>
              </div>
            </div>

            <div class="tap-hint">👆 Tap to flip back</div>
          </div>
        </div>
      </div>
    </main>

    <!-- Bottom Controls (Flashcards) -->
    <div class="controls-bar" id="controlsBar">
      <button class="nav-btn" onclick="prevCard()">← Prev</button>
      <button class="nav-btn shuffle-btn" onclick="shuffleDeck()" title="Shuffle">🔀</button>
      <button class="nav-btn primary-next" onclick="nextCard()">Next →</button>
    </div>

    <!-- TEST MODE VIEW -->
    <section class="test-panel" id="testPanel">
      <div>
        <div class="exercise-switch">
          <button class="ex-tab active" id="tabSpelling" onclick="setTestExercise('spelling')">✏️ Practice Spelling</button>
          <button class="ex-tab" id="tabUnscramble" onclick="setTestExercise('unscramble')">🔀 Unscramble Letters</button>
        </div>

        <div class="stats-row">
          <span class="stat-chip" id="testProgress">Word 1 / 23</span>
          <span class="stat-chip" id="testScore">Score: 0</span>
          <span class="stat-chip streak" id="testStreak">🔥 0</span>
        </div>
      </div>

      <!-- Exercise 1: Spelling -->
      <div id="spellingBox" class="test-prompt-box">
        <div class="test-emoji-frame" id="spellEmojiFrame" style="background:#FFF3E0;">
          <span id="spellEmoji">🎒</span>
        </div>
        <button class="listen-btn" onclick="speakTestWord()">🔊 Listen to Word</button>
        <div class="hint-text" id="spellHint">_ _ _ _ _ _ (6 letters)</div>
        <input type="text" id="spellInput" class="spelling-input" placeholder="Type word here..." autocomplete="off" spellcheck="false" />
        <div class="test-btn-row">
          <button class="t-btn secondary" onclick="revealSpellHint()">💡 Hint</button>
          <button class="t-btn check" id="spellCheckBtn" onclick="checkSpelling()">Check ✔️</button>
          <button class="t-btn next" id="spellNextBtn" onclick="nextTestWord()">Next ➡️</button>
        </div>
      </div>

      <!-- Exercise 2: Unscramble -->
      <div id="unscrambleBox" class="test-prompt-box hidden">
        <div class="test-emoji-frame" id="unscEmojiFrame" style="background:#FFF3E0;">
          <span id="unscEmoji">🎒</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px;">
          <button class="listen-btn" onclick="speakTestWord()">🔊 Listen</button>
          <span class="badge-sub" id="unscSubHint">Day 1</span>
        </div>
        <div class="answer-slots" id="answerSlots"></div>
        <div class="letter-bank" id="letterBank"></div>
        <div class="test-btn-row">
          <button class="t-btn secondary" onclick="clearUnscramble()">🔄 Reset</button>
          <button class="t-btn check" id="unscCheckBtn" onclick="checkUnscramble()">Check ✔️</button>
          <button class="t-btn next" id="unscNextBtn" onclick="nextTestWord()">Next ➡️</button>
        </div>
      </div>

      <div class="feedback-line" id="testFeedback"></div>
    </section>
  </div>

  <script>
    const deckData = [
      // Days
      { word: "Monday", russian: "понедельник", emoji: "🎒", sub: "Day 1", bg: "#FFF3E0", cat: "days", catLabel: "Days" },
      { word: "Tuesday", russian: "вторник", emoji: "🖍️", sub: "Day 2", bg: "#E8F5E9", cat: "days", catLabel: "Days" },
      { word: "Wednesday", russian: "среда", emoji: "🧩", sub: "Day 3", bg: "#E3F2FD", cat: "days", catLabel: "Days" },
      { word: "Thursday", russian: "четверг", emoji: "🚀", sub: "Day 4", bg: "#F3E5F5", cat: "days", catLabel: "Days" },
      { word: "Friday", russian: "пятница", emoji: "🎉", sub: "Day 5", bg: "#FFFDE7", cat: "days", catLabel: "Days" },
      { word: "Saturday", russian: "суббота", emoji: "🛝", sub: "Day 6", bg: "#FCE4EC", cat: "days", catLabel: "Days" },
      { word: "Sunday", russian: "воскресенье", emoji: "☀️", sub: "Day 7", bg: "#E0F7FA", cat: "days", catLabel: "Days" },
      // Seasons
      { word: "Spring", russian: "весна", emoji: "🌸", sub: "Flowers bloom", bg: "#FCE4EC", cat: "seasons", catLabel: "Seasons" },
      { word: "Summer", russian: "лето", emoji: "🏖️", sub: "Sunny & warm", bg: "#FFFDE7", cat: "seasons", catLabel: "Seasons" },
      { word: "Autumn", russian: "осень", emoji: "🍂", sub: "Leaves fall", bg: "#FFF3E0", cat: "seasons", catLabel: "Seasons" },
      { word: "Winter", russian: "зима", emoji: "⛄", sub: "Cold & snowy", bg: "#E3F2FD", cat: "seasons", catLabel: "Seasons" },
      // Months
      { word: "January", russian: "январь", emoji: "❄️", sub: "Month 1", bg: "#E3F2FD", cat: "months", catLabel: "Months" },
      { word: "February", russian: "февраль", emoji: "💖", sub: "Month 2", bg: "#FCE4EC", cat: "months", catLabel: "Months" },
      { word: "March", russian: "март", emoji: "🍀", sub: "Month 3", bg: "#E8F5E9", cat: "months", catLabel: "Months" },
      { word: "April", russian: "апрель", emoji: "🌧️", sub: "Month 4", bg: "#E0F7FA", cat: "months", catLabel: "Months" },
      { word: "May", russian: "май", emoji: "🌷", sub: "Month 5", bg: "#F3E5F5", cat: "months", catLabel: "Months" },
      { word: "June", russian: "июнь", emoji: "🦋", sub: "Month 6", bg: "#FFFDE7", cat: "months", catLabel: "Months" },
      { word: "July", russian: "июль", emoji: "🍉", sub: "Month 7", bg: "#FFEBEE", cat: "months", catLabel: "Months" },
      { word: "August", russian: "август", emoji: "🍦", sub: "Month 8", bg: "#FFF3E0", cat: "months", catLabel: "Months" },
      { word: "September", russian: "сентябрь", emoji: "🍎", sub: "Month 9", bg: "#E8F5E9", cat: "months", catLabel: "Months" },
      { word: "October", russian: "октябрь", emoji: "🎃", sub: "Month 10", bg: "#FFF3E0", cat: "months", catLabel: "Months" },
      { word: "November", russian: "ноябрь", emoji: "🦃", sub: "Month 11", bg: "#EFEBE9", cat: "months", catLabel: "Months" },
      { word: "December", russian: "декабрь", emoji: "🎄", sub: "Month 12", bg: "#E0F2F1", cat: "months", catLabel: "Months" }
    ];

    let activeCategory = 'all';
    let currentDeck = [...deckData];
    let currentIndex = 0;
    let isFlipped = false;

    // Test Mode State
    let appMode = 'cards';
    let testExercise = 'spelling';
    let testQueue = [];
    let testIdx = 0;
    let score = 0;
    let streak = 0;
    let spellHintCount = 0;
    let scrambledLetters = [];
    let chosenIndices = [];
    let questionSolved = false;

    // Web Speech API (British English en-GB, rate 0.92)
    function speakEnglish(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-GB';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentCard() {
      const card = currentDeck[currentIndex];
      if (card) speakEnglish(card.word);
    }

    function speakTestWord() {
      const item = testQueue[testIdx];
      if (item) speakEnglish(item.word);
    }

    // Category Filter
    function setCategory(cat, btn) {
      activeCategory = cat;
      document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');

      currentDeck = cat === 'all' ? [...deckData] : deckData.filter(d => d.cat === cat);
      currentIndex = 0;
      isFlipped = false;
      document.getElementById('cardScene').classList.remove('is-flipped');

      if (appMode === 'cards') {
        renderCard();
      } else {
        initTestQueue();
      }
    }

    // Switch App Mode
    function switchAppMode(mode) {
      appMode = mode;
      window.speechSynthesis.cancel();

      document.getElementById('btnModeCards').classList.toggle('active', mode === 'cards');
      document.getElementById('btnModeTest').classList.toggle('active', mode === 'test');

      document.getElementById('flashcardStage').classList.toggle('hidden', mode !== 'cards');
      document.getElementById('controlsBar').classList.toggle('hidden', mode !== 'cards');
      document.getElementById('progressWrap').classList.toggle('hidden', mode !== 'cards');
      document.getElementById('testPanel').classList.toggle('active', mode === 'test');

      if (mode === 'cards') {
        document.getElementById('subtitleText').textContent = "Tap card to flip & hear pronunciation";
        renderCard();
      } else {
        document.getElementById('subtitleText').textContent = "Listen, spell, and unscramble!";
        initTestQueue();
      }
    }

    // Render Flashcard
    function renderCard() {
      const card = currentDeck[currentIndex];
      const scene = document.getElementById('cardScene');
      isFlipped = false;
      scene.classList.remove('is-flipped');

      document.getElementById('frontCatBadge').textContent = card.catLabel;
      document.getElementById('frontSubBadge').textContent = card.sub;
      document.getElementById('frontEmoji').textContent = card.emoji;
      document.getElementById('frontEmojiFrame').style.background = card.bg;
      document.getElementById('frontWord').textContent = card.word;

      document.getElementById('backSubBadge').textContent = card.sub;
      document.getElementById('backEmoji').textContent = card.emoji;
      document.getElementById('backWord').textContent = card.word;
      document.getElementById('backRussian').textContent = card.russian;

      const pct = ((currentIndex + 1) / currentDeck.length) * 100;
      document.getElementById('progressFill').style.width = `${pct}%`;
      document.getElementById('progressLabel').textContent = `${currentIndex + 1} / ${currentDeck.length}`;
    }

    function flipCard() {
      const scene = document.getElementById('cardScene');
      isFlipped = !isFlipped;
      scene.classList.toggle('is-flipped', isFlipped);
      if (isFlipped) {
        speakCurrentCard();
      }
    }

    function nextCard() {
      currentIndex = (currentIndex + 1) % currentDeck.length;
      renderCard();
    }

    function prevCard() {
      currentIndex = (currentIndex - 1 + currentDeck.length) % currentDeck.length;
      renderCard();
    }

    function shuffleDeck() {
      for (let i = currentDeck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [currentDeck[i], currentDeck[j]] = [currentDeck[j], currentDeck[i]];
      }
      currentIndex = 0;
      renderCard();
    }

    // Touch Swipe Navigation
    let touchStartX = 0;
    const stageEl = document.getElementById('flashcardStage');
    stageEl.addEventListener('touchstart', e => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    stageEl.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 48) {
        if (diff < 0) nextCard();
        else prevCard();
      }
    }, { passive: true });

    // Keyboard Shortcuts
    document.addEventListener('keydown', e => {
      if (appMode !== 'cards') return;
      if (e.code === 'Space') {
        e.preventDefault();
        flipCard();
      } else if (e.code === 'ArrowRight') {
        nextCard();
      } else if (e.code === 'ArrowLeft') {
        prevCard();
      } else if (e.key.toLowerCase() === 'r') {
        speakCurrentCard();
      }
    });

    // ================= TEST MODE LOGIC =================
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function setTestExercise(ex) {
      testExercise = ex;
      document.getElementById('tabSpelling').classList.toggle('active', ex === 'spelling');
      document.getElementById('tabUnscramble').classList.toggle('active', ex === 'unscramble');
      document.getElementById('spellingBox').classList.toggle('hidden', ex !== 'spelling');
      document.getElementById('unscrambleBox').classList.toggle('hidden', ex !== 'unscramble');
      loadTestQuestion();
    }

    function initTestQueue() {
      const base = activeCategory === 'all' ? deckData : deckData.filter(d => d.cat === activeCategory);
      testQueue = shuffleArray(base);
      testIdx = 0;
      score = 0;
      streak = 0;
      loadTestQuestion();
    }

    function updateTestStats() {
      document.getElementById('testProgress').textContent = `Word ${testIdx + 1} / ${testQueue.length}`;
      document.getElementById('testScore').textContent = `Score: ${score}`;
      document.getElementById('testStreak').textContent = `🔥 ${streak}`;
    }

    function loadTestQuestion() {
      const item = testQueue[testIdx];
      questionSolved = false;
      updateTestStats();

      const fb = document.getElementById('testFeedback');
      fb.textContent = '';

      if (testExercise === 'spelling') {
        spellHintCount = 0;
        document.getElementById('spellEmoji').textContent = item.emoji;
        document.getElementById('spellEmojiFrame').style.background = item.bg;
        updateSpellHintText();

        const inp = document.getElementById('spellInput');
        inp.value = '';
        inp.className = 'spelling-input';
        inp.disabled = false;

        document.getElementById('spellCheckBtn').style.display = 'block';
        document.getElementById('spellNextBtn').style.display = 'none';
      } else {
        document.getElementById('unscEmoji').textContent = item.emoji;
        document.getElementById('unscEmojiFrame').style.background = item.bg;
        document.getElementById('unscSubHint').textContent = item.sub;

        const letters = item.word.split('');
        let mixed = shuffleArray(letters);
        if (mixed.join('') === item.word && new Set(letters).size > 1) {
          mixed.reverse();
        }
        scrambledLetters = mixed;
        chosenIndices = [];

        document.getElementById('unscCheckBtn').style.display = 'block';
        document.getElementById('unscNextBtn').style.display = 'none';
        renderUnscramble();
      }

      speakEnglish(item.word);
    }

    // Spelling Exercise
    function updateSpellHintText() {
      const word = testQueue[testIdx].word;
      let out = [];
      for (let i = 0; i < word.length; i++) {
        out.push(i < spellHintCount ? word[i] : '_');
      }
      document.getElementById('spellHint').textContent = `${out.join(' ')} (${word.length} letters)`;
    }

    function revealSpellHint() {
      if (questionSolved) return;
      const word = testQueue[testIdx].word;
      if (spellHintCount < word.length) {
        spellHintCount++;
        updateSpellHintText();
      }
    }

    function checkSpelling() {
      if (questionSolved) return;
      const item = testQueue[testIdx];
      const inp = document.getElementById('spellInput');
      const fb = document.getElementById('testFeedback');
      const guess = inp.value.trim();
      if (!guess) return;

      if (guess.toLowerCase() === item.word.toLowerCase()) {
        questionSolved = true;
        inp.value = item.word;
        inp.className = 'spelling-input correct';
        inp.disabled = true;
        score++;
        streak++;
        updateTestStats();
        fb.style.color = '#10b981';
        fb.textContent = `✨ Correct! ${item.word} (${item.russian})`;
        document.getElementById('spellCheckBtn').style.display = 'none';
        document.getElementById('spellNextBtn').style.display = 'block';
        speakEnglish(item.word);
      } else {
        streak = 0;
        updateTestStats();
        inp.classList.remove('wrong');
        void inp.offsetWidth;
        inp.classList.add('wrong');
        fb.style.color = '#ef4444';
        fb.textContent = 'Not quite — listen again and try once more!';
        speakEnglish(item.word);
      }
    }

    document.getElementById('spellInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (questionSolved) nextTestWord();
        else checkSpelling();
      }
    });

    // Unscramble Exercise
    function renderUnscramble() {
      const item = testQueue[testIdx];
      const slotsDiv = document.getElementById('answerSlots');
      const bankDiv = document.getElementById('letterBank');

      slotsDiv.className = 'answer-slots';
      slotsDiv.innerHTML = '';
      for (let i = 0; i < item.word.length; i++) {
        const slot = document.createElement('div');
        if (i < chosenIndices.length) {
          const idx = chosenIndices[i];
          slot.className = 'slot-box filled';
          slot.textContent = scrambledLetters[idx];
          slot.onclick = () => {
            if (questionSolved) return;
            chosenIndices.splice(i, 1);
            renderUnscramble();
          };
        } else {
          slot.className = 'slot-box';
        }
        slotsDiv.appendChild(slot);
      }

      bankDiv.innerHTML = '';
      scrambledLetters.forEach((ch, idx) => {
        const btn = document.createElement('button');
        btn.className = 'letter-tile';
        btn.textContent = ch;
        btn.disabled = chosenIndices.includes(idx) || questionSolved;
        btn.onclick = () => {
          if (questionSolved) return;
          chosenIndices.push(idx);
          renderUnscramble();
        };
        bankDiv.appendChild(btn);
      });
    }

    function clearUnscramble() {
      if (questionSolved) return;
      chosenIndices = [];
      document.getElementById('testFeedback').textContent = '';
      renderUnscramble();
    }

    function checkUnscramble() {
      if (questionSolved) return;
      const item = testQueue[testIdx];
      const fb = document.getElementById('testFeedback');
      const slotsDiv = document.getElementById('answerSlots');
      const built = chosenIndices.map(i => scrambledLetters[i]).join('');

      if (built.length < item.word.length) {
        fb.style.color = '#d97706';
        fb.textContent = 'Place all letters in the slots first!';
        return;
      }

      if (built.toLowerCase() === item.word.toLowerCase()) {
        questionSolved = true;
        slotsDiv.classList.add('correct');
        score++;
        streak++;
        updateTestStats();
        fb.style.color = '#10b981';
        fb.textContent = `✨ Awesome! ${item.word} (${item.russian})`;
        document.getElementById('unscCheckBtn').style.display = 'none';
        document.getElementById('unscNextBtn').style.display = 'block';
        renderUnscramble();
        speakEnglish(item.word);
      } else {
        streak = 0;
        updateTestStats();
        slotsDiv.classList.remove('wrong');
        void slotsDiv.offsetWidth;
        slotsDiv.classList.add('wrong');
        fb.style.color = '#ef4444';
        fb.textContent = 'Not quite! Tap a placed letter or Reset to try again.';
        speakEnglish(item.word);
      }
    }

    function nextTestWord() {
      testIdx++;
      if (testIdx >= testQueue.length) {
        testQueue = shuffleArray(testQueue);
        testIdx = 0;
      }
      loadTestQuestion();
    }

    // Init
    renderCard();
  </script>
</body>
</html>
